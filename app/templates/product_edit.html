<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑产品 - 三琪配送商库存系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .sidebar { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; position: fixed; width: 240px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75); border-radius: 10px; margin: 3px 10px; padding: 10px 16px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(233,69,96,0.2); color: #fff; }
        .main-content { margin-left: 240px; min-height: 100vh; }
        .topbar { background: #fff; border-bottom: 1px solid #eee; padding: 16px 30px; }
        .form-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 36px; max-width: 600px; }
        .form-control { border-radius: 10px; border: 2px solid #e8e8e8; padding: 10px 14px; }
        .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,0.1); }
    </style>
</head>
<body>
    {% include 'dashboard_header.html' %}
    <div class="main-content">
        <div class="topbar">
            <h4 class="mb-0 fw-bold"><i class="fas fa-edit text-danger me-2"></i>编辑产品</h4>
        </div>
        <div class="p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert" style="border-radius:12px;">
                    {{ message }} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            <div class="form-card">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-box text-danger me-1"></i>产品名称 *</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name }}" required autofocus>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">分类</label>
                            <input type="text" name="category" class="form-control" value="{{ product.category }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">单位</label>
                            <input type="text" name="unit" class="form-control" value="{{ product.unit }}">
                        </div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label fw-semibold">当前库存</label>
                            <input type="text" class="form-control" value="{{ product.stock }} {{ product.unit }}（不可直接编辑）" disabled>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold"><i class="fas fa-bell text-danger me-1"></i>预警阈值</label>
                            <input type="number" name="threshold" class="form-control" value="{{ product.threshold }}" min="1">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger flex-grow-1" style="border-radius:10px;padding:12px;">
                            <i class="fas fa-check me-1"></i>保存修改
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary" style="border-radius:10px;padding:12px;">
                            <i class="fas fa-arrow-left me-1"></i>返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
